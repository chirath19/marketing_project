<section class="journey-panel mt-6" aria-label="Request progress"><p class="workspace-kicker">WHAT HAPPENS NEXT</p><p class="mt-2">{{ explanation }}</p>{% if current != None %}<ol class="journey-steps">{% for step in steps %}<li {% if step.current %}aria-current="step"{% endif %} class="{% if step.done %}is-done{% endif %}"><span aria-hidden="true">{% if step.done %}✓{% else %}{{ forloop.counter }}{% endif %}</span>{{ step.label }}</li>{% endfor %}</ol>{% endif %}</section>
