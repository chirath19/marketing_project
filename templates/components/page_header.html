<div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
  <div class="min-w-0">
    {% if eyebrow %}<p class="t-eyebrow">{{ eyebrow }}</p>{% endif %}
    <h1 class="t-page-title">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 t-meta">{{ subtitle }}</p>{% endif %}
  </div>
  {% if slot %}<div class="flex shrink-0 flex-wrap items-center gap-2">{{ slot }}</div>{% endif %}
</div>
