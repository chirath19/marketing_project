# Railway deployment configuration.
#
# Static files are collected at build time and served by WhiteNoise, so no
# separate static host is needed. Migrations run in the release phase from
# the Procfile, before the new version takes traffic.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements/prod.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-3} --threads 2 --timeout 60 --access-logfile - --error-logfile -"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
